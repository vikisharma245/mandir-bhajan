{"name":"APK banao","on":{"push":{"tags":["v*"]},"workflow_dispatch":null},"permissions":{"contents":"write"},"jobs":{"apk":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Source kholo","run":"if [ -f source.zip ]; then unzip -oq source.zip -d app && cp -r app/. . && rm -rf app; fi\n"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"21"}},{"uses":"subosito/flutter-action@v2","with":{"channel":"stable","cache":true}},{"name":"Signing key","env":{"KS_B64":"${{ secrets.KEYSTORE_B64 }}","KS_PASS":"${{ secrets.KEYSTORE_PASSWORD }}"},"run":"cd android/app\nif [ -n \"$KS_B64\" ]; then\n  echo \"$KS_B64\" | base64 -d > release.jks; PASS=\"$KS_PASS\"\nelse\n  PASS=$(openssl rand -hex 12)\n  keytool -genkeypair -v -keystore release.jks -alias mandir -keyalg RSA -keysize 2048 -validity 10000 -storepass \"$PASS\" -keypass \"$PASS\" -dname \"CN=Mandir Bhajan\"\nfi\nprintf 'storePassword=%s\\nkeyPassword=%s\\nkeyAlias=mandir\\nstoreFile=release.jks\\n' \"$PASS\" \"$PASS\" > ../key.properties\n"},{"run":"flutter pub get"},{"run":"flutter build apk --release"},{"run":"cp build/app/outputs/flutter-apk/app-release.apk mandir-bhajan.apk"},{"uses":"actions/upload-artifact@v4","with":{"name":"mandir-bhajan-apk","path":"mandir-bhajan.apk"}},{"name":"Release","if":"startsWith(github.ref, 'refs/tags/v')","uses":"softprops/action-gh-release@v2","with":{"files":"mandir-bhajan.apk"}}]}}}
